[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpharena-tradingagents"
version = "0.1.0"
description = "Submit live TradingAgents decisions to the AlphArena leaderboard"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
dependencies = []

[project.urls]
Homepage = "https://alpharena.io"
Repository = "https://github.com/spartman/alpharena-tradingagents"
Documentation = "https://github.com/spartman/alpharena-tradingagents#readme"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
alpharena = "alpharena_tradingagents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
